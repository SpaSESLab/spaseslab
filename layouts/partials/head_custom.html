<style>
  /* ── Color variables ── */
  :root {
    --mulberry: #5C2340;

    --pebble: #B8A198;
    --sandstone: #D5CBC4;
    --border: #B5ADA6;
  }

  /* ── Sidebar styling ── */
  .project-sidebar {
    background: var(--mulberry);
  }

  /* Sidebar code link cards — pebble-tinted translucency */
  .sidebar-code-link {
    background: rgba(184, 161, 152, 0.12);
    border: 1px solid rgba(184, 161, 152, 0.2);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .sidebar-code-link:hover {
    background: rgba(184, 161, 152, 0.22);
    border-color: rgba(184, 161, 152, 0.35);
  }

  /* Sidebar related project links */
  .sidebar-related-link {
    transition: padding-left 0.15s ease;
  }
  .sidebar-related-link:hover {
    padding-left: 0.25rem;
  }

  /* Sidebar tag pills — pebble tint */
  .sidebar-tag {
    color: var(--sandstone);
    background: rgba(184, 161, 152, 0.15);
    border: 1px solid rgba(184, 161, 152, 0.2);
    transition: background 0.15s ease;
  }
  .sidebar-tag:hover {
    background: rgba(184, 161, 152, 0.28);
    color: #fff;
  }

  /* ── Main content: publications box — slate accents ── */
  .project-pub-link {
    background: #f7f9fa;

    transition: border-color 0.15s ease, background 0.15s ease;

  }

    color: var(--slate);
  }
  .project-meta a:hover {
    color: var(--mulberry);
  }

  /* ── Title block ── */
  .project-title-block {
    margin-bottom: 1.5rem;
  }

  /* ── Body text reading width ── */
  .post-body {
    max-width: 65ch;
  }
  .post-body img {
    max-width: 100%;
  }
